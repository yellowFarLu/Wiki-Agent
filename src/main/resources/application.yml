server:
  port: 8090

spring:
  application:
    name: wiki-agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  # ============================================================
  # v1-v5 §11.2 数据源：开发期 H2 MySQL 兼容模式（生产切 MySQL）
  # 实施校正：原方案文档 §11.2 直接用 MySQL；为保持"变更前可启动"
  # 约束，开发期保留 H2 文件库 + MODE=MySQL，生产用 MYSQL_HOST 环境变量切换
  # ============================================================
  datasource:
    url: ${MYSQL_URL:jdbc:h2:file:./data/h2/kb;AUTO_SERVER=TRUE;MODE=MySQL}
    driver-class-name: ${MYSQL_DRIVER:org.h2.Driver}
    username: ${MYSQL_USER:sa}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:update}   # 开发 update；生产 validate
    open-in-view: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  # Flyway 数据库迁移（V1-V8 SQL）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true       # 已有库基线化，不阻断启动
    validate-on-migrate: false       # H2 兼容模式部分语法差异，放宽校验
    create-schemas: true             # 自动创建 schema（H2 public / MySQL wikiagent）

  # Redis（§3 短期记忆 + §6 历史事件 SETNX + §22 分布式锁）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Spring AI DashScope
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${WIKIAGENT_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${WIKIAGENT_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: 1024

  # v4 §16 集中式 Session 兜底（通过 wikiagent.session.redis-enabled 条件开启）
  session:
    store-type: ${SESSION_STORE:none}   # 默认 none；生产 redis
    redis:
      namespace: wikiagent:session
      flush-mode: on_save

logging:
  level:
    io.milvus: WARN
    com.wikiagent: INFO

# ============================================================
# Actuator + Prometheus（§8 全链路可观测）
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  defaults:
    metrics:
      export:
        enabled: true            # 显式开启（部分环境默认被关闭）
  prometheus:
    metrics:
      export:
        enabled: true            # prometheus 导出显式开启
  metrics:
    tags:
      application: wiki-agent

# ============================================================
# WikiAgent 业务配置
# ============================================================
wikiagent:
  milvus:
    uri: ${MILVUS_URI:http://${MILVUS_HOST:localhost}:${MILVUS_PORT:19530}}
    username: ${MILVUS_USERNAME:root}
    password: ${MILVUS_PASSWORD:milvus}
    database: default
    collection: wikiagent_chunks
    dimension: 1024
    bm25-k1: 1.2
    bm25-b: 0.75
  retrieve:
    sub-topk: 20
    final-topk: 10
    rrf-k: 60
    parent-char-budget: 12000
  agent:
    enabled: true
    max-rounds: 2
    max-queries-per-round: 3

  # ============================================================
  # 知识库未命中兜底（实施校正 2026-09-22）
  # 检索结果为空时：优先联网搜索（DashScope enable_search，已实测），
  # 其次模型自身通用知识；回答中强制声明来源属性，不伪装成知识库内容。
  # 两者都关闭则沿用"知识库未命中"拒答。
  # ============================================================
  fallback:
    web-search-enabled: ${WIKIAGENT_FALLBACK_WEB_SEARCH_ENABLED:true}
    own-knowledge-enabled: ${WIKIAGENT_FALLBACK_OWN_KNOWLEDGE_ENABLED:true}

  # v1-v2 §3-§6 记忆层
  memory:
    short-term-max-turns: 20          # 短期记忆最多 20 轮
    short-term-ttl-hours: 24           # Redis TTL 24h
    handover-dir: ./data/handover      # 交接清单存储目录（file 模式/历史迁移用）
    # 子项目 A §5：交接清单适配器，交付后默认 mysql（file 实现保留供回退）
    handover-adapter: ${WIKIAGENT_MEMORY_HANDOVER_ADAPTER:mysql}   # file | mysql
    # 一次性历史文件迁移开关：开发默认 false；docker compose 初始化置 true
    file-migration:
      enabled: ${WIKIAGENT_MEMORY_FILE_MIGRATION_ENABLED:false}

  # v1-v2 §7 LLM 路由
  routing:
    # 实施校正 2026-09-22：模型名经 DashScope API 实测（qwen-3.8-* 不存在，会报 Model not exist）
    intent-model: ${WIKIAGENT_INTENT_MODEL:qwen-flash}     # 意图识别模型（快/省）
    simple-model: ${WIKIAGENT_SIMPLE_MODEL:qwen-plus}      # 简单任务模型
    complex-model: ${WIKIAGENT_COMPLEX_MODEL:qwen-max}     # 复杂任务模型
    mock-intents-enabled: ${WIKIAGENT_MOCK_INTENTS_ENABLED:true}  # 关闭后 4 个 Mock 意图降级为 knowledge_qa

  # v3 §6.5 身份权限
  identity:
    default-identity: business        # 未配置身份用户的默认值（最严，避免越权）
    admin-token: ${WIKIAGENT_ADMIN_TOKEN:}   # 开发期 X-Admin-Token 头部校验

  # v1-v2 §10 安全护栏
  security:
    input-guardrail-enabled: true
    spotlighting-enabled: true
    rule-of-two-enabled: true

  # v4 §6.6 知识冲突检测
  conflict:
    threshold: ${WIKIAGENT_CONFLICT_THRESHOLD:0.8}   # 相似度 > 0.8 视为冲突
    scan-cron: "0 30 2 * * ?"                          # 每日 02:30 扫已入库 chunk

  # v4 §6.6.2 知识指标看板
  metrics:
    tau-time-days: 180                                 # 时间衰减常数
    tau-frequency-days: 30                             # 使用频率衰减常数
    stale-threshold: 0.3                               # stale_score < 0.3 视为过期知识
    aggregation-cron: "0 0 2 * * ?"                    # 每日 02:00 聚合作业

  # v5 §19 Agent 安全网关
  gateway:
    input:
      detectors: [keyword_blacklist, llm_judge]
      llm-judge:
        model: ${WIKIAGENT_INTENT_MODEL:qwen-flash}
        block-threshold: 0.7
    output:
      detectors: [moderation, system_prompt_leak, presidio_pii]
      moderation:
        categories: [涉政, 涉黄, 暴恐, 违法违规]
        openai-moderation-enabled: false
      presidio:
        sidecar-url: ${PRESIDIO_URL:http://presidio-analyzer:5050}
        operators: [mask]

  # v4 §16 接入层会话亲和
  session:
    redis-enabled: ${WIKIAGENT_SESSION_REDIS:false}   # 默认 false；生产 true

  # ============================================================
  # 实施校正：Redis 总开关（开发默认 false，无需 Redis 即可启动）
  # false 时 ConditionalInfraEnvironmentPostProcessor 排除 Redisson/Redis
  #   自动装配，短期记忆/情景记忆/分布式锁切换进程内降级实现；
  #   docker-compose / 生产环境必须置 true（§3/§6/§22 硬约束）。
  # ============================================================
  redis:
    enabled: ${REDIS_ENABLED:false}

  # v6 §20 Plan-Execute-Reflect-Optimize
  pero:
    enabled: ${WIKIAGENT_PERO_ENABLED:true}
    react:
      max-iterations: 8
      tool-whitelist-by-step-type:
        search_kb: [search_knowledge_base]
        search_history: [search_history]
        update_profile: [update_user_profile]
        tool: [search_knowledge_base, search_history, update_user_profile, read_handover, list_abandoned_paths]
        generate: []
    reflect:
      model: ${WIKIAGENT_COMPLEX_MODEL:qwen-max}
      episodic-memory-ttl-days: 30
    optimize:
      enabled: true

  # ============================================================
  # 子项目 F1 工具权限治理：toolName → 角色/scope/批准语义 + 每 Agent 白名单
  # 优先级：本配置 > DB tool_permission 表（V15） > 内置默认
  # ============================================================
  tool-permissions:
    permissions:
      # 写工具：需 scope profile:write 且需人工批准（高危）
      update_user_profile:
        required-scope: profile:write
        requires-approval: true
    agent-allowlists:
      # PERO 主 Agent 默认全量白名单；示例给出 Supervisor 收窄示例（可被部署覆盖）
      pero-agent: [search_knowledge_base, search_history, update_user_profile, read_handover, list_abandoned_paths]

  # v6 §21 Multi-Agent 架构
  multi-agent:
    enabled: ${WIKIAGENT_MULTI_AGENT_ENABLED:true}
    framework: spring-ai-alibaba-agent-framework
    supervisor-factory: lazy
    intent-agents: [knowledge_qa, ai_coding, customer_intake, business_rule_config, order_query]
    routing-field: identity

  # v6 §22 多 Agent 并发控制
  concurrency:
    lock:
      provider: redisson
      default-ttl-seconds: 5
      todo:
        lock-mode: flock
      milvus:
        dedup-window-minutes: 5
    state-reducer:
      default: overwrite
      list-keys: [messages, episodic_memory]

  # ============================================================
  # 子项目 A §6 任务框架（MySQL 状态机 + MQ 投递 + Redis 协调）
  # 框架默认开启 + mq=local：JVM 本地调度，开发环境零外部中间件；
  # docker compose / 生产通过 TASK_MQ=rocketmq 切换 RocketMQ。
  # ============================================================
  task:
    enabled: ${WIKIAGENT_TASK_ENABLED:true}
    mq: ${TASK_MQ:local}                # local | rocketmq
    concurrency:
      ingest: 2                         # cg-task-ingest 消费并发
      agent: 4                          # cg-task-agent 消费并发
    lease-ttl-sec: 30                   # Worker 租约 TTL
    heartbeat-sec: 10                   # 心跳续租间隔
    recovery-scan-sec: 15               # 崩溃租约回收扫描周期
    dispatch-retry-scan-sec: 5          # PENDING 滞留补偿扫描周期
    tenant-max-concurrent: 0            # 同租户并发上限，0 表示不限
    defaults:
      max-attempts: 3
      step-timeout-sec: 300
      agent-step-timeout-sec: 180
      deadline-sec: 1800
    backoff: [10s, 30s, 2m]            # 指数退避（RocketMQ 延迟等级 3/4/6）

  ingest:
    parent-chars: 1000
    parent-overlap: 150
    child-chars: 350
    child-overlap: 60
    embedding-batch: 10
  # 子项目 B：文档智能解析（OCR/ASR/版面/表格）。provider=none 或缺 API Key 时流水线自动跳过 AI 能力
  parse:
    provider: ${WIKIAGENT_PARSE_PROVIDER:dashscope}
    max-file-mb: 200
    scanned-page-char-threshold: 20
    # 文本层/OCR 双跑相似度低于该值（差异率超阈）→ CONFLICT 标记，不静默选一个
    text-conflict-similarity: 0.85
    ocr-timeout-sec: 30
    asr-timeout-sec: 120
    layout-timeout-sec: 30
    table-timeout-sec: 60
    max-attempts: 3
    retry-backoff-base-ms: 500
    circuit-open-sec: 60
    circuit-failure-threshold: 3
    vision-model: qwen-vl-plus
    asr-model: paraformer-v2
    # ASR 要求文件公网可访问；部署 OSS 后配置前缀（如 https://bucket.oss.../audio），留空则 ASR 能力不可用
    asr-file-base-url: ${WIKIAGENT_PARSE_ASR_BASE_URL:}
    dashscope-base-url: https://dashscope.aliyuncs.com/api/v1
  extract:
    # 字段置信度低于该值自动转人工 REVIEW（规格 §2.1 默认 0.75）
    low-confidence-threshold: 0.75
    # 结构化输出校验失败后的修复重试次数
    repair-attempts: 1

  # ============================================================
  # 子项目 E：RAG / 模型治理（E2 降级链 + E3 缓存 + E4 打点成本 + E5 检索权限）
  # ============================================================
  llm:
    max-attempts: 2                       # provider 单次调用重试次数
    retry-backoff-ms: 300                 # 重试退避基数（线性）
    circuit-failure-threshold: 3          # 连续失败熔断阈值
    circuit-open-sec: 60                  # 熔断打开秒数
    # 单价（元 / 1K tokens）：tokensInPrice:tokensOutPrice，未配置模型成本记 null
    pricing:
      qwen-flash: "0.0005:0.001"
      qwen-plus: "0.0008:0.002"
      qwen-max: "0.02:0.06"
  rerank:
    # DashScope rerank 实装，默认开启；无 API Key 时 provider.available()=false 自动跳过，
    # 调用失败由上层保持原序降级（不产生硬依赖）
    enabled: ${WIKIAGENT_RERANK_ENABLED:true}
    model: gte-rerank
    base-url: ${WIKIAGENT_RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
  # 灰度发布（需求10/15）：按身份稳定哈希分桶放量；未配置的特性不门控（全量放开）。
  # 灰度键为当前请求身份（RetrievalSecurityContext），无身份归入 anonymous 桶。
  # 放量示例：features.rerank.percent=10 即 rerank 对 10% 身份放量；
  # allowlist 恒命中 / denylist 恒拒绝（优先级高于 percent）。
  gray:
    features: {}
  # ============================================================
  # GraphRAG 知识图谱（需求2）：LLM 实体/关系抽取 + 图感知检索
  # enabled=false 时 GraphExtractionService/GraphRagService 不装配，
  # 入库流水线与检索主链路零影响（ObjectProvider 空回退）。
  # ============================================================
  graph:
    enabled: ${WIKIAGENT_GRAPH_ENABLED:false}   # 默认关闭；开启后入库时 LLM 抽取实体关系
    max-neighbors: 10                            # 图检索 1-hop 邻居扩展上限
    max-chars-per-chunk: 1500                    # 单 chunk 送入抽取模型的最大字符数

  cache:
    embedding:
      enabled: ${WIKIAGENT_CACHE_EMBEDDING_ENABLED:true}
      ttl-seconds: 86400
    answer:
      enabled: ${WIKIAGENT_CACHE_ANSWER_ENABLED:false}   # 默认关闭防幻觉
      ttl-seconds: 600
